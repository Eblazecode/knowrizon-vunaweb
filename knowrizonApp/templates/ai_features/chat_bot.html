{% load static %}

 <section class="section">
  <div class="section-body">
    <div class="row">
      <!-- Chat Sidebar -->
      <div class="col-xs-12 col-sm-12 col-md-3 col-lg-3">
        <div class="card">
          <div class="body">
            <div id="plist" class="people-list">
              <div class="chat-search">

              </div>
              <div class="m-b-20">
                <div id="chat-scroll">
                  <ul class="chat-list list-unstyled m-b-0">
                    <li class="clearfix active">
                     <img src="{% static 'assets/img/chatbot.jpeg' %}" alt="avatar">
                      <div class="about">
                        <div class="name">Vunaweb AI Librarian</div>
                        <div class="status">
                          <i class="material-icons online">fiber_manual_record</i> Online
                        </div>
                      </div>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Chat Window -->
      <div class="col-xs-12 col-sm-12 col-md-9 col-lg-9">
        <div class="card">
          <div class="chat">
            <div class="chat-header clearfix">
           <img src="{% static 'assets/img/chatbot.jpeg' %}" alt="avatar">
              <div class="chat-about">
                <div class="chat-with">Vunaweb AI Librarian</div>
                <div class="chat-num-messages">Ask me anything about books!</div>
              </div>
            </div>
          </div>

          <!-- Chat Messages -->
          <div class="chat-box" id="mychatbox">
            <div class="card-body chat-content" id="chat-messages">
              <p><b>Bot:</b> Hello! How can I assist you today?</p>
            </div>

            <!-- Chat Input -->
            <div class="card-footer chat-form">
              <form id="chat-form" onsubmit="sendMessage(event)">
                <input type="text" id="user-input" class="form-control" placeholder="Type a message">
                <button class="btn btn-primary">
                  <i class="far fa-paper-plane"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<script>
  function sendMessage(event) {
    event.preventDefault();

    let userInput = document.getElementById("user-input").value;
    let chatMessages = document.getElementById("chat-messages");

    if (userInput.trim() === "") return;

    chatMessages.innerHTML += `<p><b>You:</b> ${userInput}</p>`;

    fetch("/library-chatbot/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userInput })
    })
    .then(response => response.json())
    .then(data => {
        chatMessages.innerHTML += `<p><b>Bot:</b> ${data.reply}</p>`;
    })
    .catch(error => {
        chatMessages.innerHTML += `<p><b>Bot:</b> Sorry, I couldn't process your request.</p>`;
        console.error("Error:", error);
    });

    document.getElementById("user-input").value = "";
  }
</script>
