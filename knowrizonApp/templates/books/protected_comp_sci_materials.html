
{% extends "base.html" %}
{% load static %}
{% block title %}books categories {% endblock %}

{% block content %}

<div class="section-header">
   <div class="row">
      <div class="col-12 col-md-4">
         <div class="card sticky-top">
            <div class="card-header bg-primary text-white">
               <h4>Search & Filter</h4>
            </div>
            <div class="card-body">
               <form action="" method="GET">
                  <div class="form-group">
                     <input type="text" name="search" id="search" class="form-control"
                            placeholder="Search by title, author, or category"
                            onkeyup="filterBooks()">
                  </div>
                  <div class="form-group">
                     <label for="category">Filter by Category</label>
                     <select name="category" id="category" class="form-control" onchange="filterBooks()">
                        <option value="">All Categories</option>
                        <option value="algorithms">Algorithms</option>
                        <option value="artificial_intelligence">Artificial Intelligence</option>
                        <option value="data_science">Data Science</option>
                        <option value="web_development">Web Development</option>
                        <!-- Add other categories dynamically -->
                     </select>
                  </div>
                  <div class="form-group">
                     <label for="media">Filter by Media Type</label>
                     <select name="media" id="media" class="form-control" onchange="filterBooks()">
                        <option value="">All Media Types</option>
                        <option value="video_books">Video Books</option>
                        <option value="audio_books">Audio Books</option>
                        <option value="journal_books">Journal Books</option>
                     </select>
                  </div>
               </form>
            </div>
         </div>
      </div>

      <div class="col-12 col-md-8">
         <div class="row" id="book-list">
            {% for category in book_categories %}
            <div class="col-12 col-md-6 col-lg-4">
               <div class="card card-primary">
                  <div class="card-header">
                     <h5>{{ category.name }}</h5>
                  </div>
                  <div class="card-body">
                     <p>{{ category.description }}</p>
                     <a href="{% url 'view_books' category.slug %}" class="btn btn-primary">
                        <i class="fas fa-book"></i> View Books
                     </a>
                  </div>
               </div>
            </div>
            {% endfor %}
         </div>
      </div>
   </div>
</div>

<script>
   function filterBooks() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const categoryFilter = document.getElementById('category').value;
      const mediaFilter = document.getElementById('media').value;

      document.querySelectorAll('#book-list .card').forEach(card => {
         const title = card.querySelector('.card-header h5').textContent.toLowerCase();
         const matchesSearch = title.includes(searchTerm);
         const matchesCategory = categoryFilter === "" || title.includes(categoryFilter);
         const matchesMedia = mediaFilter === "" || card.querySelector('a').getAttribute('href').includes(mediaFilter);

         card.style.display = matchesSearch && matchesCategory && matchesMedia ? '' : 'none';
      });
   }
</script>

{% endblock %}
